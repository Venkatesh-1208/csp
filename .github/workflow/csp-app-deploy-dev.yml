name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - feature/*
      - development
      - main

env:
  DOTNET_VERSION: '8.0.x'

jobs:

# -----------------------------------
# 1. BUILD + TEST (UNCHANGED)
# -----------------------------------
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

# -----------------------------------
# 2. BUILD & PUSH DOCKER IMAGE
# -----------------------------------
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          IMAGE=${{ vars.ACR_NAME }}.azurecr.io/csp-backend:${{ github.sha }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Image
        run: docker build -t ${{ steps.image.outputs.image }} .

      - name: Push Image
        run: docker push ${{ steps.image.outputs.image }}

# -----------------------------------
# 3. DEPLOY TO DEV
# -----------------------------------
  deploy-dev:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/development'

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Settings (DEV)
        run: |
          az webapp config appsettings set \
            --name ${{ vars.WEBAPP_NAME_DEV }} \
            --resource-group ${{ vars.RG_DEV }} \
            --settings \
              WEBSITES_PORT=8080 \
              ASPNETCORE_URLS="http://+:8080" \
              AzureBlobStorage__ConnectionString="${{ secrets.BLOB_CONNECTION_STRING_DEV }}" \
              EntraId__TenantId="${{ secrets.ENTRAID__TENANTID }}" \
              EntraId__ClientId="${{ secrets.ENTRAID__CLIENTID }}" \
              EntraId__Authority="${{ secrets.ENTRAID__AUTHORITY }}" \
              ExternalId__TenantId="${{ secrets.EXTERNALID__TENANTID }}" \
              ExternalId__ClientId="${{ secrets.EXTERNALID__CLIENTID }}" \
              ExternalId__Authority="${{ secrets.EXTERNALID__AUTHORITY }}"

      - name: Deploy Container (DEV)
        run: |
          az webapp config container set \
            --name ${{ vars.WEBAPP_NAME_DEV }} \
            --resource-group ${{ vars.RG_DEV }} \
            --docker-custom-image-name ${{ needs.docker-build-push.outputs.image }}

      - name: Restart App (DEV)
        run: |
          az webapp restart \
            --name ${{ vars.WEBAPP_NAME_DEV }} \
            --resource-group ${{ vars.RG_DEV }}

# -----------------------------------
# 4. DEPLOY TO UAT
# -----------------------------------
  deploy-uat:
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/development'

    environment: uat

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Settings (UAT)
        run: |
          az webapp config appsettings set \
            --name ${{ vars.WEBAPP_NAME_UAT }} \
            --resource-group ${{ vars.RG_UAT }} \
            --settings \
              WEBSITES_PORT=8080 \
              ASPNETCORE_URLS="http://+:8080" \
              AzureBlobStorage__ConnectionString="${{ secrets.BLOB_CONNECTION_STRING_UAT }}" \
              EntraId__TenantId="${{ secrets.ENTRAID__TENANTID }}" \
              EntraId__ClientId="${{ secrets.ENTRAID__CLIENTID }}" \
              EntraId__Authority="${{ secrets.ENTRAID__AUTHORITY }}" \
              ExternalId__TenantId="${{ secrets.EXTERNALID__TENANTID }}" \
              ExternalId__ClientId="${{ secrets.EXTERNALID__CLIENTID }}" \
              ExternalId__Authority="${{ secrets.EXTERNALID__AUTHORITY }}"

      - name: Deploy Container (UAT)
        run: |
          az webapp config container set \
            --name ${{ vars.WEBAPP_NAME_UAT }} \
            --resource-group ${{ vars.RG_UAT }} \
            --docker-custom-image-name ${{ needs.docker-build-push.outputs.image }}

      - name: Restart App (UAT)
        run: |
          az webapp restart \
            --name ${{ vars.WEBAPP_NAME_UAT }} \
            --resource-group ${{ vars.RG_UAT }}
